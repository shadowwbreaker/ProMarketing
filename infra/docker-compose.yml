# Dev environment (D-017): Docker Desktop + WSL2. Usage from repo root:
#   copy .env.example .env   (then fill FIELD_ENCRYPTION_KEY)
#   Clean startup. Demo fixtures are opt-in through docker-compose.test.yml.
#   docker compose -f infra/docker-compose.yml up --build
name: promarketing
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promarketing
      POSTGRES_PASSWORD: promarketing
      POSTGRES_DB: promarketing
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promarketing"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  backend:
    build: ../backend
    env_file: ../.env
    environment:
      DB_CONN_MAX_AGE: "0"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["../backend:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ../backend
    env_file: ../.env
    command: celery -A config worker -l info
    volumes: ["../backend:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    build: ../backend
    env_file: ../.env
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes: ["../backend:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
